<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outcomes Console Mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="AXLE navigation">
    <div class="brand"><img src="assets/antarax-mark-white.svg" alt="AntaraX"><b>AXLE</b><span class="chip-product">Outcomes</span></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot"><div class="who" id="who"></div><p class="credit">Authorised REKA staff · every action is recorded</p></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="topbar">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
      <div class="scope"><label for="scope">Organisation</label><select id="scope" aria-label="Organisation scope" disabled title="Scope is mocked: pages link to organisations directly"><option>All organisations</option></select></div>
      <button type="button" class="find" aria-label="Find (Ctrl K)"><span>Find</span><kbd>⌘K</kbd></button>
      <span class="health-dot" role="img" aria-label="Collection: 1 stale and 1 failing source" title="1 stale, 1 failing"></span>
      <div class="staff-menu"><button type="button" class="staff-btn" id="staff-btn" aria-haspopup="true" aria-expanded="false"></button><div class="staff-pop" id="staff-pop" hidden></div></div>
    </header>
    <div class="banner" role="note"><span aria-hidden="true">▲</span><span><b>Example data.</b> Every organisation, person and figure here is invented, to show how the console works. Nothing here is a real client or a real result.</span></div>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
